name: Deploy to GitHub Pages

on:
  push:
    branches: [main, feature/bulk-edit]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out main
        uses: actions/checkout@v4
        with:
          ref: main
          path: main

      - name: Check out feature/bulk-edit
        id: preview
        continue-on-error: true
        uses: actions/checkout@v4
        with:
          ref: feature/bulk-edit
          path: preview

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Build main
        working-directory: main
        run: |
          npm ci
          npm run build

      - name: Build feature/bulk-edit preview
        if: steps.preview.outcome == 'success'
        working-directory: preview
        env:
          BASE_PATH: /good-tickets/preview/bulk-edit/
        run: |
          npm ci
          npm run build
          mkdir -p ../main/dist/preview
          cp -r dist ../main/dist/preview/bulk-edit

      - uses: actions/upload-pages-artifact@v3
        with:
          path: main/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
